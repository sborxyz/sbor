name: Test Aave contract reads

# Reads Aave V3 on Ethereum and Base straight from the contracts and prints the
# result beside the DefiLlama figures SBOR publishes today. Then lists every
# Stacks pool on DefiLlama, to show where SBOR's depth figures come from. Manual only. It
# commits nothing and changes nothing: it exists to prove the reads are right
# before they are allowed anywhere near the fixing.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # continue-on-error so the depth check below still runs if Aave disagrees.
      - name: Read Aave from the contracts and compare
        continue-on-error: true
        run: node scripts/aave.mjs

      - name: Show how DefiLlama reports Stacks depth
        run: node scripts/check-depth.mjs
