name: Test a full fixing without publishing

# Runs the whole fixing, the Aave contract reads and the change feed exactly as
# the morning job does, then prints what they produced. Manual only. It has no
# permission to push and commits nothing: everything it writes disappears with
# the runner. Run it before any change to fetch.mjs goes live.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Compute a fixing, not published
        run: node scripts/fetch.mjs

      - name: Record parameter changes, twice
        run: |
          node scripts/changes.mjs
          node scripts/changes.mjs

      - name: Show what was produced
        run: |
          node -e '
          const d = require("./api/v1/latest.json");
          console.log("\nPARAMETERS READ FROM THE CONTRACTS");
          for (const [m, f] of Object.entries(d.parameters?.markets || {})) console.log("  " + m.padEnd(18) + JSON.stringify(f));
          console.log("\nCOMPARISON, WHERE EACH MARKET CAME FROM");
          for (const m of d.externalReference?.markets || []) console.log("  " + (m.venue + " " + m.asset).padEnd(34) + "borrow " + String(m.borrow).padStart(5) + "  source " + (m.source || "none"));
          const p = d.poxReference;
          console.log("\nSBOR-PoX");
          if (!p) console.log("  NOT PUBLISHED: the PoX calculation failed, see the Compute step log");
          else console.log("  cycle " + p.cycle + ", burn blocks " + p.cycleStartBurnBlock + " to " + p.cycleEndBurnBlock + ", measurement " + (p.measurement ?? "none") + "\n  " + p.btcPaid + " BTC paid on " + p.stxLocked.toLocaleString("en-US") + " STX locked, APY " + p.apy + "%");
          const bu = d.bitcoinCollateralUsdc;
          console.log("\nBITCOIN-COLLATERAL USDC, MORPHO");
          if (!bu) console.log("  NOT PUBLISHED: see the Compute step log");
          else {
            for (const m of bu.markets) console.log("  " + (m.chain + " " + m.collateral + "/USDC").padEnd(22) + "borrow " + String(m.borrow).padStart(5) + "%  supply " + String(m.supply).padStart(5) + "%  util " + String(m.utilization).padStart(6) + "%  depth $" + (m.depthUsd/1e6).toFixed(1) + "M  lltv " + m.lltv + "%");
            console.log(bu.borrow != null ? "  reference: borrow " + bu.borrow + "%, supply " + bu.supply + "%, depth $" + (bu.depthUsd/1e6).toFixed(0) + "M" : "  reference withheld, not every market was read: " + JSON.stringify(bu.notRead));
          }
          console.log("\nINDICES, each market and where its size came from");
          for (const [label, ix] of Object.entries(d.indices || {})){
            console.log("  " + label + ": borrow " + ix.borrow + "%  supply " + ix.supply + "%  " + ix.markets.length + " market(s)");
            for (const m of ix.markets) console.log("     " + (m.venue + " " + m.asset).padEnd(18) + "borrow " + String(m.borrow).padStart(5) + "%  depth $" + (m.depthUsd/1e6).toFixed(2) + "M  size from " + (m.depthSource || "?") + "  weight " + m.weight);
          }
          for (const [label, w] of Object.entries(d.withheld || {})) console.log("  " + label + ": WITHHELD. " + w.reason);
          const dyn = (d.notes || []).filter(n => /on this fixing/.test(n));
          console.log(dyn.length ? "  notes about this fixing:\n" + dyn.map(n => "     " + n).join("\n") : "  no market missing, nothing read from a fallback");
          const c = require("./api/v1/changes.json");
          console.log("\nCHANGE FEED: baseline holds " + Object.keys(c.baseline?.markets || {}).length + " markets, " + c.changes.length + " changes recorded\n");
          '
