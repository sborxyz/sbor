name: Publish to Stacks

# Posts each day's SBOR rates to the sbor-fixings contract on Stacks mainnet,
# after the daily fixing has published. Separate from the fixing, so a problem
# on Stacks can never stop or delay SBOR's own publication. Run by hand with
# "address" to print the publisher's Stacks address, the one to send STX to.
on:
  workflow_run:
    workflows: ["SBOR daily fixing"]
    types: [completed]
  workflow_dispatch:
    inputs:
      mode:
        description: "publish today's fixing, or show the publisher's Stacks address"
        type: choice
        options: [publish, address]
        default: publish

permissions:
  contents: read

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the one library it needs
        run: npm install --no-save --no-audit --no-fund @stacks/transactions@7.6.0
      - name: Publish, or show the address
        shell: bash
        env:
          ARC_PUBLISHER_KEY: ${{ secrets.ARC_PUBLISHER_KEY }}
          STACKS_CONTRACT: ${{ vars.STACKS_CONTRACT }}
          MODE: ${{ github.event.inputs.mode || 'publish' }}
        run: |
          set -o pipefail
          if [ "$MODE" = "address" ]; then ARG=address; else ARG=; fi
          # Up to three attempts a minute apart: public endpoints have brief outages,
          # and one should not raise an alarm. On 7 October 2026 a two-minute Hiro
          # outage did exactly that.
          : > stacks.txt; ok=0
          for attempt in 1 2 3; do
            if node scripts/stacks-publish.mjs $ARG | tee -a stacks.txt; then ok=1; break; fi
            if [ "$attempt" -lt 3 ]; then echo "attempt $attempt failed, retrying in 60 seconds" | tee -a stacks.txt; sleep 60; fi
          done
          { echo "## Publish to Stacks"; echo '```text'; cat stacks.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          [ "$ok" = 1 ]
      - name: Say so if it failed
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TG_TOKEN" ]; then exit 0; fi
          MSG=$(printf 'SBOR on Stacks: publication FAILED on %s.\n\nThe fixing itself was published. Check the run:\nhttps://github.com/sborxyz/sbor/actions' "$(date -u +%Y-%m-%d)")
          curl -sS -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$TG_CHAT" \
            --data-urlencode "disable_web_page_preview=true" \
            --data-urlencode "text=$MSG" > /dev/null
