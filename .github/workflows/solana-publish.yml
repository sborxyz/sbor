name: Publish to Solana

# Posts each day's SBOR rates on Solana mainnet, as a signed memo, after the
# daily fixing has published. Separate from the fixing, so a problem on Solana
# can never stop or delay SBOR's own publication. Run by hand with "address"
# to print the publisher's Solana address, the one to send SOL to.
on:
  workflow_run:
    workflows: ["SBOR daily fixing"]
    types: [completed]
  workflow_dispatch:
    inputs:
      mode:
        description: "publish today's fixing, or show the publisher's Solana address"
        type: choice
        options: [publish, address]
        default: publish

permissions:
  contents: read

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the one library it needs
        run: npm install --no-save --no-audit --no-fund @solana/web3.js@1.99.0
      - name: Publish, or show the address
        shell: bash
        env:
          ARC_PUBLISHER_KEY: ${{ secrets.ARC_PUBLISHER_KEY }}
          MODE: ${{ github.event.inputs.mode || 'publish' }}
        run: |
          set -o pipefail
          if [ "$MODE" = "address" ]; then ARG=address; else ARG=; fi
          node scripts/solana-publish.mjs $ARG | tee solana.txt
          { echo "## Publish to Solana"; echo '```text'; cat solana.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Say so if it failed
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TG_TOKEN" ]; then exit 0; fi
          MSG=$(printf 'SBOR on Solana: publication FAILED on %s.\n\nThe fixing itself was published. Check the run:\nhttps://github.com/sborxyz/sbor/actions' "$(date -u +%Y-%m-%d)")
          curl -sS -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$TG_CHAT" \
            --data-urlencode "disable_web_page_preview=true" \
            --data-urlencode "text=$MSG" > /dev/null
