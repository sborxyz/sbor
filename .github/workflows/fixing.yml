name: SBOR daily fixing

on:
  schedule:
    - cron: "23 8 * * *"     # target 11:00 UTC. Scheduled early because GitHub runs late,
                             # and off the hour because every free tier cron sits at minute zero.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fixing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Compute fixing
        env:
          # Every scheduled run is the daily fixing.
          # Manual runs count too, so you can force one when testing.
          SBOR_FIXING: "1"
        run: node scripts/fetch.mjs

      - name: Draft a post if something moved
        id: draft
        run: node scripts/post.mjs
        continue-on-error: true

      - name: Commit if changed
        run: |
          git config user.name  "sbor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A api latest.txt post.txt post.json post-state.json
          if git diff --staged --quiet; then
            echo "No change, nothing to commit."
          else
            git commit -m "fixing $(date -u +%Y-%m-%d) [skip netlify]"
            git push
          fi

      # Only pings when something actually moved. A quiet day stays quiet.
      # One message per draft, so each arrives ready to copy and paste.
      - name: Notify if there is something to post
        if: steps.draft.outputs.has_drafts == 'true'
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TG_TOKEN" ]; then
            echo "No Telegram token set, skipping notification."
            exit 0
          fi
          node -e '
            const fs = require("fs");
            const d = JSON.parse(fs.readFileSync("post.json", "utf8"));
            if (!d.top) process.exit(0);
            /* Everything below the rule is for the reader, not for the post.
               Copy stops at the rule. */
            const extra = d.otherCount
              ? `\n\n\u2014\u2014\u2014 not part of the post \u2014\u2014\u2014\n${d.otherCount} other thing${d.otherCount>1?"s":""} moved: sbor.xyz/post.txt`
              : "";
            fetch(`https://api.telegram.org/bot${process.env.TG_TOKEN}/sendMessage`, {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify({
                chat_id: process.env.TG_CHAT,
                text: d.top.text + extra,
                disable_web_page_preview: true,
                link_preview_options: { is_disabled: true }
              })
            }).then(async r => { if (!r.ok) console.error("telegram", r.status, await r.text()); });
          '
          echo "Notified."

      # Silence is not success. If the fixing breaks, say so.
      - name: Notify on failure
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TG_TOKEN" ]; then exit 0; fi
          MSG=$(printf 'SBOR fixing FAILED on %s.\n\nNo fixing was published. Check the run:\nhttps://github.com/sborxyz/sbor/actions' "$(date -u +%Y-%m-%d)")
          curl -sS -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$TG_CHAT" \
            --data-urlencode "disable_web_page_preview=true" \
            --data-urlencode "text=$MSG" > /dev/null
